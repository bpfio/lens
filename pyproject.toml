[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture"
version = "1.0.0"
description = "AI protocol translator — Anthropic / OpenAI Responses API ↔ Chat Completions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
aperture = "aperture.__main__:main"
